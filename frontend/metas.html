<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

<style>
    .meta-previsao { font-size: 12px; color: #8FA1A3; }
    .meta-previsao.ok { color: #10B981; }
    .meta-previsao.alerta { color: #FBBF24; }
    .meta-mensal { font-size: 12px; color: #6FE7DD; }
    .aviso-media { background: rgba(111,231,221,0.08); padding: 12px 16px; border-radius: 8px; margin-top: 15px; color: #6FE7DD; }

    /* Modal guardar/retirar valor */
    .modal-overlay {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.55);
        align-items: center;
        justify-content: center;
        z-index: 1000;
    }
    .modal-box {
        background: #14201F;
        border: 1px solid rgba(111,231,221,0.2);
        border-radius: 10px;
        padding: 24px;
        width: 90%;
        max-width: 360px;
        color: #E5F2F0;
    }
    .modal-box h3 {
        margin: 0 0 8px 0;
        font-size: 16px;
    }
    .modal-box .modal-label {
        font-size: 13px;
        color: #8FA1A3;
        margin-bottom: 14px;
    }
    .modal-box input {
        width: 100%;
        box-sizing: border-box;
        padding: 8px 10px;
        border-radius: 6px;
        border: 1px solid rgba(111,231,221,0.3);
        background: #0E1716;
        color: #E5F2F0;
        margin-bottom: 8px;
    }
    .modal-erro {
        display: none;
        color: #EF4444;
        font-size: 12px;
        margin-bottom: 8px;
    }
    .modal-actions {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
        margin-top: 8px;
    }
    .modal-actions button {
        padding: 6px 14px;
        border-radius: 6px;
        cursor: pointer;
        background: transparent;
        border: 1px solid #8FA1A3;
        color: #8FA1A3;
    }
    #modalMetaConfirmar {
        border: 1px solid #10B981;
        color: #10B981;
    }
</style>
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/metas.css">
    <link rel="icon" type="./img/png" href="img/LumuzIA.png">
</head>

<body>

    <aside class="sidebar">

        <div
            class="sidebar-brand"
            style="
                display:flex;
                align-items:center;
                justify-content:center;
                margin-bottom:10px;
            "
        >

            <img
                src="img/LumuzIA.png"
                alt="LumuzIA"
                style="
                    width:80px;
                    height:80px;
                    border-radius:50%;
                    object-fit:cover;
                "
            >

        </div>


        <a href="dashboard.html">Dashboard</a>
        <a href="gastos.html">Gastos</a>
        <a href="receitas.html">Receitas</a>
        <a href="metas.html">Metas</a>
        <a href="investimentos.html">Investimentos</a>
        <a href="relatorio.html">Relatório</a>
        <a href="chat.html">Chat</a>
        <a href="perfil.html">Perfil</a>
    </aside>


    <main>

        <h1>Metas Financeiras</h1>

        <div id="avisoMedia" class="aviso-media" style="display:none;"></div>

        <div class="form">

            <input
                id="nome"
                type="text"
                placeholder="Nome da Meta"
            >


            <input
                id="valorObjetivo"
                type="number"
                min="0"
                step="0.01"
                placeholder="Valor Objetivo"
            >


            <input
                id="prazo"
                type="number"
                min="1"
                placeholder="Prazo (meses)"
            >


            <button
                type="button"
                onclick="salvarMeta()"
            >
             Salvar Meta
            </button>

        </div>


        <section class="filtro-tabela">
            <h2 style="margin-top:0;">Filtrar metas</h2>
            <div class="filtro-tabela-grid">
                <input id="filtroMetaNome" placeholder="Nome da meta">
                <input id="filtroMetaMin" type="number" step="0.01" placeholder="Objetivo mínimo">
                <input id="filtroMetaMax" type="number" step="0.01" placeholder="Objetivo máximo">
                <input id="filtroMetaPrazoMin" type="number" placeholder="Prazo mínimo (meses)">
                <input id="filtroMetaPrazoMax" type="number" placeholder="Prazo máximo (meses)">
                <input id="filtroMetaInicio" type="date" title="Data inicial">
                <input id="filtroMetaFim" type="date" title="Data final">
            </div>
            <div class="filtro-acoes"><button class="btn-filtrar" type="button" onclick="filtrarMetas()">Filtrar</button><button class="btn-limpar" type="button" onclick="limparFiltroMetas()">Limpar filtros</button></div>
            <div id="contagemMetas" class="filtro-contagem"></div>
        </section>

        <div class="table-wrap">

            <table>

                <thead>

                    <tr>

                        <th>Meta</th>

                        <th>Objetivo</th>

                        <th>Guardado</th>

                        <th>Prazo</th>

                        <th>Progresso</th>

                        <th>Previsão</th>

                        <th>Meta Mensal</th>

                        <th>Data</th>

                        <th>Ações</th>

                    </tr>

                </thead>


                <tbody id="tabelaMetas">

                    <tr>

                        <td colspan="9">
                            Carregando metas...
                        </td>

                    </tr>

                </tbody>

            </table>

        </div>

    </main>

    <!-- =====================================================
         MODAL GUARDAR / RETIRAR VALOR
    ====================================================== -->

    <div id="modalMetaOverlay" class="modal-overlay">
        <div class="modal-box">
            <h3 id="modalMetaTitulo">Guardar valor</h3>
            <div id="modalMetaLabel" class="modal-label"></div>

            <input
                id="modalMetaValor"
                type="number"
                min="0.01"
                step="0.01"
                placeholder="Valor (R$)"
                onkeydown="if(event.key==='Enter'){confirmarModalMeta();}"
            >

            <div id="modalMetaErro" class="modal-erro"></div>

            <div class="modal-actions">
                <button type="button" onclick="fecharModalMeta()">Cancelar</button>
                <button id="modalMetaConfirmar" type="button" onclick="confirmarModalMeta()">Guardar</button>
            </div>
        </div>
    </div>

    <!-- =====================================================
         JAVASCRIPT
    ====================================================== -->

    <script
        type="module"
        src="./js/metas.js"
    ></script>

<script src="./js/sidebar.js"></script>
</body>
</html>
