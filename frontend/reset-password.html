<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Redefinir senha · Minha IA</title>
<link rel="stylesheet" href="./css/style.css">
</head>
<body>

<div class="wrap" id="wrap">
  <div>
    <div class="brand">
      <div class="brand-mark"><span></span><span></span><span></span><span></span></div>
      <div class="brand-name">Minha IA</div>
    </div>

    <div class="card">
      <h1 id="cardTitle">Redefinir senha</h1>
      <p class="sub" id="cardSub">Escolha uma nova senha para sua conta.</p>

      <div class="msg" id="msg"></div>

      <!-- Formulário de nova senha -->
      <form id="resetForm">
        <div class="field">
          <label for="newPassword">Nova senha</label>
          <input type="password" id="newPassword" placeholder="••••••••" required minlength="6">
        </div>
        <div class="field">
          <label for="confirmPassword">Confirmar nova senha</label>
          <input type="password" id="confirmPassword" placeholder="••••••••" required minlength="6">
        </div>
        <button type="submit" class="btn btn-primary" id="resetBtn">Salvar nova senha</button>
      </form>

      <!-- Mostrado depois que a senha for redefinida com sucesso -->
      <div id="successBlock" style="display:none;">
        <p class="sub">Sua senha foi redefinida com sucesso.</p>
        <a href="./index.html" class="btn btn-primary" style="display:block; text-align:center; text-decoration:none;">Ir para o login</a>
      </div>

      <!-- Mostrado se o link for inválido ou expirado -->
      <div id="invalidBlock" style="display:none;">
        <p class="sub">Este link é inválido ou já expirou. Solicite um novo link de redefinição.</p>
        <a href="./index.html" class="btn btn-primary" style="display:block; text-align:center; text-decoration:none;">Voltar ao login</a>
      </div>
    </div>
  </div>
</div>


<script type="module" src="./js/reset-password.js"></script>
</body>
</html>
