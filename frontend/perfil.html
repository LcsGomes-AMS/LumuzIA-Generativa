<!DOCTYPE html>
<html lang="pt-BR" data-auth-pending>
<head>

<meta charset="UTF-8">
    <style>html[data-auth-pending] body { display: none !important; }</style>
    <script src="./js/auth-guard.js"></script>
    <noscript><meta http-equiv="refresh" content="0;url=./cad.html"></noscript>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Perfil - LumuzIA</title>
<link rel="icon" type="./img/png" href="img/LumuzIA.png">
<link rel="stylesheet" href="./css/style.css">

</head>
<body>

    <div class="container">
        <aside class="sidebar">
            <div class="sidebar-brand" style="display:flex;align-items:center;justify-content:center;margin-bottom:10px;">
                <img src="img/LumuzIA.png" alt="LumuzIA" style="width:50px;height:50px;border-radius:50%;object-fit:cover;">
            </div> 
            <a href="como-usar.html">Como Usar</a> 
            <a href="dashboard.html">Informações Gerais</a>
            <a href="gastos.html">Gastos</a>
            <a href="receitas.html">Receitas</a>
            <a href="metas.html">Metas</a>
            <a href="investimentos.html">Investimentos</a>
            <a href="relatorio.html">Relatório</a>
            <a href="chat.html">Chat</a>
            <a href="perfil.html">Perfil</a>
        </aside>
        <main>
            <h1>Meu Perfil</h1>

            <div id="lzLoading" class="lz-loading">verificando sessão...</div>

            <div id="lzProfile" class="lz-card" style="display:none;">
                <div class="lz-top">
                    <div class="lz-avatar-wrap">
                        <div class="lz-avatar" id="lzAvatar">U</div>
                        <button type="button" class="lz-avatar-edit" id="lzAvatarEditBtn" title="Alterar foto"><svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path></svg></button>
                        <button type="button" class="lz-avatar-remove" id="lzAvatarRemoveBtn" title="Remover foto" style="display:none;">×</button>
                        <input type="file" id="lzAvatarInput" accept="image/jpeg,image/png,image/webp" hidden>
                    </div>
                    <div>
                        <p class="lz-name" id="lzName">Usuário</p>
                        <div class="lz-status"><span class="lz-dot"></span> conectado</div>
                    </div>
                </div>

                <div class="lz-msg" id="lzMsg"></div>

                <div class="lz-field">
                    <label for="lzEditName">Nome de exibição</label>
                    <input type="text" id="lzEditName" placeholder="Seu nome">
                </div>

                <div class="lz-row">
                    <span class="lz-k">E-mail</span>
                    <span class="lz-v" id="lzEmail">-</span>
                </div>
                <div class="lz-row">
                    <span class="lz-k">Método de login</span>
                    <span class="lz-v" id="lzProvider">-</span>
                </div>
                <div class="lz-row">
                    <span class="lz-k">Conta criada em</span>
                    <span class="lz-v" id="lzCreated">-</span>
                </div>

                <div class="lz-actions">
                    <button class="lz-btn lz-btn-primary" id="lzSaveBtn">Salvar alterações</button>
                    <button class="lz-btn lz-btn-secondary" id="lzLogoutBtn">Sair</button>
                </div>
            </div>
        </main>
    </div>

<script type="module" src="./js/config.js"></script>
<script type="module" src="./js/perfil.js"></script>
<script src="./js/sidebar.js"></script>
</body>
</html>
